apis:
- aid: twinstrand-biosciences:content
  name: TwinStrand Biosciences Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API served at
    https://twinstrandbio.com/wp-json/wp/v2 — the peer-reviewed publication index (`publication`, 38
    published) with its topical and chronological taxonomies (`publication-category` 11 terms,
    `publication-year` 14 terms), the patent estate (`patent`, 28), conference posters (`poster`, 14),
    news and press releases (`news`, 27), events (`event`, 30), team-member profiles (`team-member`,
    10), marketing / product / legal pages (24), the 370-item media library, and a site-wide search
    endpoint. Responses carry page/per_page pagination with X-WP-Total / X-WP-TotalPages headers and
    an RFC 8288 Link header. This is the site CMS content API, not a TwinStrand product API:
    TwinStrand publishes no OpenAPI for it, so the definition in this repo was derived mechanically
    from the live route-discovery document at https://twinstrandbio.com/wp-json/ and covers the public
    read surface only.'
  humanURL: https://twinstrandbio.com/publications/
  baseURL: https://twinstrandbio.com/wp-json/wp/v2
