aid: twinstrand-biosciences
name: TwinStrand Biosciences
description: 'TwinStrand Biosciences is a Seattle, Washington genomics company founded in 2015 by
  Jesse Salk and Michael Schmitt that develops and commercializes Duplex Sequencing, an
  error-corrected next-generation-sequencing chemistry licensed from the University of Washington
  that independently tracks both strands of an individual DNA molecule and compares them, cutting
  sequencing error rates from roughly 1-in-100 to below 1-in-10,000,000 per nucleotide and making
  ultra-rare mutations detectable. The company sells DuplexSeq assay kits — a Mutagenesis Assay for
  genetic toxicology in human, rat and mouse models, an AML MRD Assay for minimal residual disease in
  acute myeloid leukemia, and a customizable assay — each paired with a proprietary cloud analysis
  pipeline that turns raw Illumina reads into duplex-consensus sequences, variant calls, mutation
  frequency, SBS spectra and assay quality metrics. That analysis software is not a public API: it is
  hosted on the DNAnexus platform and reachable only by customers through a DNAnexus project.
  TwinStrand publishes no developer portal, no API reference and no OpenAPI, AsyncAPI, GraphQL or
  Postman artifact of its own, and the api., docs. and developer. subdomains of twinstrandbio.com do
  not resolve. The only machine-readable surface on twinstrandbio.com is the WordPress REST API at
  /wp-json — 349 routes across 18 namespaces — whose wp/v2 content collections are anonymously
  readable and serve the company publication index, patent estate, conference posters, news releases,
  events, team profiles, pages and media library as JSON. Its public code lives in the
  github.com/twinstrandbio organization, which holds a single reference-data repository and no client
  libraries. The DuplexSeq Mutagenesis Assay business has since been transferred to Scantox, and Exact
  Sciences holds an exclusive license to the Duplex Sequencing technology.'
