openapi: 3.1.0
info:
  title: TwinStrand Biosciences Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: The anonymously readable content API behind twinstrandbio.com.
  description: 'DERIVED BY API EVANGELIST - NOT PUBLISHED BY TWINSTRAND BIOSCIENCES.


    TwinStrand Biosciences publishes no product or developer API. This document was derived mechanically
    from the live WordPress REST route-discovery document at https://twinstrandbio.com/wp-json/ (349 routes
    across 18 namespaces, retrieved 2026-08-05), and covers only the subset that is anonymously readable
    and carries company content: publications, patents, posters, news, events, team members, pages, media,
    taxonomies and site search.


    Every path, parameter, default and bound below is taken verbatim from that discovery document. Write
    methods (POST/PUT/PATCH/DELETE) are registered on most of these routes but require authentication
    and are deliberately omitted - this profile documents the public read surface only.


    The TwinStrand DuplexSeq analysis pipeline runs as cloud software hosted on the DNAnexus platform
    and is reachable only by customers with a DNAnexus project; it is not part of this contract.'
  contact:
    name: TwinStrand Biosciences
    url: https://twinstrandbio.com/
  license:
    name: Content (c) TwinStrand Biosciences, Inc. - all rights reserved
    url: https://twinstrandbio.com/legal/
  x-provenance:
    generated: '2026-08-05'
    method: derived
    source: https://twinstrandbio.com/wp-json/
    derived_by: API Evangelist enrichment pipeline (local-v1)
    note: TwinStrand publishes no OpenAPI. Nothing here was invented; the route document is saved verbatim
      at openapi/_source/twinstrand-biosciences-wp-json-root.json.
servers:
- url: https://twinstrandbio.com/wp-json
  description: Production
tags:
- name: Discovery
- name: Publications
- name: Patents
- name: Posters
- name: News
- name: Events
- name: People
- name: Pages
- name: Posts
- name: Media
- name: Taxonomies
- name: Search
paths:
