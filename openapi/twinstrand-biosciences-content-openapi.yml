components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords over HTTP Basic, advertised in the discovery document
        at authentication.application-passwords.endpoints.authorization = https://twinstrandbio.com/wp-admin/authorize-application.php.
        Required only for write operations and privileged reads; every operation in this document is anonymously
        readable.
  schemas:
    Resource:
      type: object
      description: A WordPress REST resource. The exact field set varies by post type; the fields below
        are those observed on anonymous GETs.
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        date_gmt:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        slug:
          type: string
        status:
          type: string
        type:
          type: string
        link:
          type: string
          format: uri
        title:
          type: object
          properties:
            rendered:
              type: string
        content:
          type: object
          properties:
            rendered:
              type: string
            protected:
              type: boolean
        excerpt:
          type: object
          properties:
            rendered:
              type: string
            protected:
              type: boolean
        featured_media:
          type: integer
        meta:
          type: object
        acf:
          type:
          - object
          - array
          description: Advanced Custom Fields payload; observed empty on the sampled publication resource.
        _links:
          type: object
          description: HAL-style link relations (self, collection, about, wp:featuredmedia, wp:term, curies).
    Error:
      type: object
      description: The WordPress REST error envelope. This is NOT RFC 9457 application/problem+json.
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          examples:
          - rest_invalid_param
          - rest_forbidden
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
            params:
              type: object
            details:
              type: object
  responses:
    InvalidParam:
      description: 'Invalid query parameter (observed: per_page above the 100 bound).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
              params:
                per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    Forbidden:
      description: Authentication required for this context or route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_forbidden
            message: Sorry, you are not allowed to do that.
            data:
              status: 401
    NotFound:
      description: 'Resource or route not found. NOTE: on twinstrandbio.com an unknown id or route is
        intercepted at the edge and answered with an HTML 404 page (text/html), not the WordPress rest_no_route
        JSON envelope - verified 2026-08-05 on GET /wp/v2/publication/999999 and GET /wp/v2/nope.'
      content:
        text/html:
          schema:
            type: string
