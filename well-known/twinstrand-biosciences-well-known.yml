host: https://twinstrandbio.com
note: 'TwinStrand Biosciences serves no /.well-known/ discovery document at all. Every RFC 8615 path below
  returned the site 404 (text/html) on both the apex and the www alias, including both agent-card paths.
  Recorded as observed — absence is valid data, and nothing was authored on TwinStrand''s behalf. There
  is no separate API host: api., docs., developer., developers., support., portal., app. and status.twinstrandbio.com
  all fail to resolve in DNS, so the apex (and its www alias, which 301s to it) is the only host with
  a discovery surface to probe.'
