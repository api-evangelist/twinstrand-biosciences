- path: /robots.txt
  status: 200
  note: 'Yoast-generated. "User-agent: * / Disallow:" — an empty Disallow, so every path is allowed to
    every crawler. No AI-crawler rules either way. Points at /sitemap_index.xml.'
- path: /sitemap_index.xml
  status: 200
  note: Yoast sitemap index covering page, event, news, patent, poster, publication, team-member and the
    publication taxonomies — the same content the wp/v2 collections expose as JSON.
- path: /feed/
  status: 200
  content_type: application/rss+xml
  note: The site-wide RSS feed is served but empty (0 <item> elements) because the `post` collection has
    0 published entries. Not wired as BlogRSS — an empty feed is not a blog feed.
- path: /company/news/feed/
  status: 403
  note: Per-post-type feed for the `news` custom post type is refused with 403.
gated_but_present:
- path: /wp-json/wp-abilities/v1/abilities
  status: 401
  body: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  note: The WordPress Abilities API registry is installed (namespace wp-abilities/v1, with /abilities,
    /abilities/{name}, /abilities/{name}/run and /categories routes) but anonymous reads are refused,
    so the ability set could not be enumerated. This is the closest thing on the host to an agent-tool
    manifest. No MCP namespace is registered — unlike some WordPress sites there is no mcp/mcp-adapter
    route here — so no MCP artifact was written.
- path: /wp-json/wp/v2/settings
  status: 401
  note: Site settings require authentication, as expected.
